spring.application.name=rootpeace-backend
server.port=8080

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# WhatsApp
meta.whatsapp.phone-id=${WHATSAPP_PHONE_ID}
meta.whatsapp.token=${WHATSAPP_TOKEN}

# Cashfree
cashfree.app-id=${CASHFREE_APP_ID}
cashfree.secret-key=${CASHFREE_SECRET_KEY}
cashfree.base-url=https://api.cashfree.com/pg

# Email # Email (If using)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=RootPeace <${MAIL_USERNAME}>

# MySQL (Uses your local details automatically if not on Railway)
# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dummy_local_db?useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dummy-local-user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dummy-local-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Redis (Uses local automatically if not on Railway)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# SMS via MSG91
msg91.auth-key=${MSG91_AUTH_KEY}
msg91.template-id=${MSG91_TEMPLATE_ID}


# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,https://rootpeace.com,https://www.rootpeace.com}
